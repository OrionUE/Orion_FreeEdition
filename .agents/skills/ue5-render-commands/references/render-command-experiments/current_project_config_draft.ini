; Shadows / Virtual Shadow Map | delta 4.63% | candidate_after_visual_review
; risk: Low/Medium: changes VSM physical page allocation policy to prefer recently used cached pages. May improve cache behavior but can cause local instability if workload differs.
r.Shadow.Virtual.Cache.AllocateViaLRU=1

; Shadows / Virtual Shadow Map | delta 2.49% | candidate_after_visual_review
; risk: Low/Medium: reduces how long unused local-light VSM pages stay cached. May reduce cache memory/maintenance but can increase misses if lights reappear.
r.Shadow.Virtual.Cache.MaxLightAgeSinceLastRequest=5

; Shadows / Virtual Shadow Map | delta 2.16% | candidate_after_visual_review
; risk: Low/Medium: disables conservative non-Nanite VSM culling if enabled. Can reduce submissions but risks missing conservative shadow coverage in edge cases.
r.Shadow.Virtual.Clipmap.UseConservativeCulling=0


