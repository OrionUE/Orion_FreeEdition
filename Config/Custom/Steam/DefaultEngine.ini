[OrionOnlineSubsystemSteam]
bEnabled=True
SteamDevAppId=480
SteamAppId=480
Port=7777
bCopySteamDlls=True
bVACEnabled=True
bUseSteamNetworking=True
bAllowP2PPacketRelay=True
bRelaunchInSteam=False
bDisableSteamRelaunchInShipping=False
P2PConnectionTimeout=90
GameServerQueryPort=27015
GameServerProductName=Orion
GameServerGameDescription=Orion
GameVersion=1.0.0.0
bOverrideMinHandshakeVersion=True
MinHandshakeVersion=0
bOverrideCurrentHandshakeVersion=True
CurrentHandshakeVersion=0

[OnlineSubsystemOrionSteam]
bEnabled=True

[OnlineSubsystem]
DefaultPlatformService=OrionSteam
NativePlatformService=OrionSteam
+AdditionalModulesToLoad=OrionOnlineSubsystemSteam
+ModuleRedirects=(OrionSteam=OrionOnlineSubsystemSteam)

[/Script/Engine.Engine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OrionSteamSockets.OrionSteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="BeaconNetDriver",DriverClassName="/Script/OrionSteamSockets.OrionSteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[PacketHandlerComponents]
+Components=OrionOnlineSubsystemSteam.OrionOnlineSteamAuthComponentModuleInterface

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=1000000000
MaxInternetClientRate=1000000000
InitialConnectTimeout=120.0

[/Script/CommonUser.CommonSessionSubsystem]
bUseBeacons=false

